name: Build RTGL1

on:
  push:
    branches: [ hl1 ]
  pull_request:
    branches: [ hl1 ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          path: Source/External/DLSS

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          version: 1.3.296.0
          use-cache: true

      - name: Compile Shaders
        shell: pwsh
        run: |
          cd Source/Shaders
          python GenerateShaders.py

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B Build/x64-Release `
            -DCMAKE_BUILD_TYPE=Release `
            -DRG_WITH_SURFACE_WIN32=ON `
            -DRG_WITH_AMD_FSR3=ON `
            -DRG_WITH_NVIDIA_NRD=ON `
            -DRG_WITH_SHADERS=OFF `
            -DRG_WITH_EXAMPLES=OFF `
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob3 /Ot /Oi /GL /Gw /Gy /fp:fast /arch:AVX2 /DNDEBUG"

      - name: Build
        shell: pwsh
        run: |
          cmake --build Build/x64-Release --config Release --parallel

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifact_rtgl1/Include/RTGL1"
          New-Item -ItemType Directory -Force -Path "artifact_rtgl1/Build/x64-Release/Release"
          New-Item -ItemType Directory -Force -Path "artifact_rtgl1/bin"
          New-Item -ItemType Directory -Force -Path "artifact_rtgl1/Build/shaders"

          Copy-Item -Path "Include/RTGL1/RTGL1.h" -Destination "artifact_rtgl1/Include/RTGL1/RTGL1.h" -Force
          Copy-Item -Path "Build/x64-Release/Release/RayTracedGL1.dll" -Destination "artifact_rtgl1/Build/x64-Release/Release/" -Force
          Copy-Item -Path "Build/x64-Release/Release/RayTracedGL1.lib" -Destination "artifact_rtgl1/Build/x64-Release/Release/" -Force
          Copy-Item -Path "Build/x64-Release/Release/NRI.dll" -Destination "artifact_rtgl1/Build/x64-Release/Release/" -Force
          if (Test-Path "Source/External/DLSS/lib/Windows_x86_64/rel") {
            Copy-Item -Path "Source/External/DLSS/lib/Windows_x86_64/rel/*.dll" -Destination "artifact_rtgl1/Build/x64-Release/Release/" -Force
          }
          Copy-Item -Path "bin/amd_fidelityfx_vk.dll" -Destination "artifact_rtgl1/bin/" -Force
          Copy-Item -Path "Build/shaders/*.spv" -Destination "artifact_rtgl1/Build/shaders/" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayTracedGL1-Artifact
          path: artifact_rtgl1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          path: Source/External/DLSS

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libwayland-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          version: 1.3.296.0
          use-cache: true

      - name: Compile Shaders
        run: |
          cd Source/Shaders
          python3 GenerateShaders.py

      - name: Configure CMake
        run: |
          cmake -B Build/linux-x64-Release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRG_WITH_SURFACE_WIN32=OFF \
            -DRG_WITH_SURFACE_WAYLAND=ON \
            -DRG_WITH_SURFACE_XLIB=ON \
            -DRG_WITH_AMD_FSR3=ON \
            -DRG_WITH_NVIDIA_NRD=ON \
            -DRG_WITH_SHADERS=OFF \
            -DRG_WITH_EXAMPLES=OFF

      - name: Build
        run: |
          cmake --build Build/linux-x64-Release --parallel

      - name: Prepare Artifact
        run: |
          mkdir -p artifact_rtgl1/Include/RTGL1
          mkdir -p artifact_rtgl1/Build/linux-x64-Release
          mkdir -p artifact_rtgl1/bin
          mkdir -p artifact_rtgl1/Build/shaders

          cp -f Include/RTGL1/RTGL1.h artifact_rtgl1/Include/RTGL1/RTGL1.h
          cp -f Build/linux-x64-Release/libRayTracedGL1.so artifact_rtgl1/Build/linux-x64-Release/
          cp -f Build/linux-x64-Release/libNRI.so artifact_rtgl1/Build/linux-x64-Release/
          cp -f Build/linux-x64-Release/libamd_fidelityfx_vk.so artifact_rtgl1/Build/linux-x64-Release/
          if [ -d Source/External/DLSS/lib/Linux_x86_64/rel ]; then
            cp -f Source/External/DLSS/lib/Linux_x86_64/rel/*.so* artifact_rtgl1/Build/linux-x64-Release/
          fi
          cp -f bin/libamd_fidelityfx_vk.so artifact_rtgl1/bin/
          cp -f Build/shaders/*.spv artifact_rtgl1/Build/shaders/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayTracedGL1-Artifact-Linux
          path: artifact_rtgl1

  trigger-xash-rt:
    needs: [ build-windows, build-linux ]
    if: github.ref == 'refs/heads/hl1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger xash-rt workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run rt.yml --repo boofiboi/xash-rt --ref master -f rtgl1_run_id=${{ github.run_id }} || echo "Could not trigger xash-rt workflow"
